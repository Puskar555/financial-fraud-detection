services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: financial-fraud-backend:1.0
    container_name: financial-fraud-backend

    ports:
      - "8001:8001"

    volumes:
      - fraudguard_data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: financial-fraud-frontend:1.0
    container_name: financial-fraud-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  fraudguard_data:
